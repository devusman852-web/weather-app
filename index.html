<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Weather</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    body {
      background:
        radial-gradient(60rem 40rem at 10% 10%, rgba(99, 102, 241, 0.35), transparent 60%),
        radial-gradient(50rem 40rem at 90% 90%, rgba(236, 72, 153, 0.25), transparent 60%),
        radial-gradient(40rem 30rem at 80% 10%, rgba(14, 165, 233, 0.25), transparent 60%),
        #0b1020;
      background-attachment: fixed;
    }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-inner {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease both; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 font-sans antialiased">

  <main class="glass w-full max-w-md rounded-3xl p-6 sm:p-8">
    <header class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight">Glass Weather</h1>
      <p class="text-sm text-slate-400">Real-time conditions for any city</p>
    </header>

    <!-- Search -->
    <form id="search-form" class="flex gap-2 mb-6" autocomplete="off">
      <label for="city-input" class="sr-only">City name</label>
      <input
        id="city-input"
        type="text"
        placeholder="Search city, e.g. Tokyo"
        required
        class="flex-1 min-w-0 rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm placeholder-slate-500
               focus:outline-none focus:ring-2 focus:ring-indigo-400/70 focus:border-transparent transition"
      />
      <button
        id="search-btn"
        type="submit"
        class="rounded-xl bg-indigo-500/80 hover:bg-indigo-500 active:scale-95 px-4 py-3 text-sm font-medium
               transition disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-indigo-300"
      >
        Search
      </button>
    </form>

    <!-- Status area (aria-live for screen readers) -->
    <div id="status" role="status" aria-live="polite">
      <!-- Empty state -->
      <div id="empty" class="text-center py-10 text-slate-400">
        <div class="text-5xl mb-3" aria-hidden="true">🌍</div>
        <p class="text-sm">Search for a city to see its temperature and humidity.</p>
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden py-10 flex flex-col items-center gap-3 text-slate-300">
        <div class="h-10 w-10 rounded-full border-4 border-white/15 border-t-indigo-400 animate-spin"></div>
        <p class="text-sm">Fetching weather…</p>
      </div>

      <!-- Error -->
      <div id="error" class="hidden rounded-xl border border-rose-400/30 bg-rose-500/10 text-rose-200 text-sm px-4 py-3"></div>
    </div>

    <!-- Result -->
    <section id="result" class="hidden fade-up" aria-label="Current weather">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 id="place" class="text-2xl font-semibold leading-tight break-words"></h2>
          <p id="subplace" class="text-sm text-slate-400"></p>
          <p id="updated" class="text-xs text-slate-500 mt-1"></p>
        </div>
        <button
          id="unit-toggle"
          type="button"
          aria-label="Toggle temperature unit between Celsius and Fahrenheit"
          class="glass-inner rounded-full px-3 py-1 text-xs font-medium hover:bg-white/10 transition focus:outline-none focus:ring-2 focus:ring-indigo-400/70"
        >°C</button>
      </div>

      <div class="flex items-center gap-4 my-6">
        <div id="icon" class="text-7xl" aria-hidden="true"></div>
        <div>
          <div class="flex items-start">
            <span id="temp" class="text-6xl font-light tracking-tight">--</span>
            <span id="unit" class="text-2xl mt-2 text-slate-300">°C</span>
          </div>
          <p id="condition" class="text-slate-300"></p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="glass-inner rounded-2xl p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">💧 Humidity</p>
          <p class="mt-1 text-2xl font-medium"><span id="humidity">--</span><span class="text-base text-slate-300">%</span></p>
        </div>
        <div class="glass-inner rounded-2xl p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">🌡️ Feels like</p>
          <p class="mt-1 text-2xl font-medium"><span id="feels">--</span><span id="feels-unit" class="text-base text-slate-300">°C</span></p>
        </div>
        <div class="glass-inner rounded-2xl p-4 col-span-2">
          <p class="text-xs uppercase tracking-wider text-slate-400">💨 Wind</p>
          <p class="mt-1 text-2xl font-medium"><span id="wind">--</span><span class="text-base text-slate-300"> km/h</span></p>
        </div>
      </div>
    </section>

    <footer class="mt-6 text-center text-xs text-slate-500">
      Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-300">Open-Meteo</a>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';

      const GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search';
      const FORECAST_URL = 'https://api.open-meteo.com/v1/forecast';

      // WMO weather codes -> [label, day icon, night icon]
      const WMO = {
        0:  ['Clear sky', '☀️', '🌙'],
        1:  ['Mainly clear', '🌤️', '🌙'],
        2:  ['Partly cloudy', '⛅', '☁️'],
        3:  ['Overcast', '☁️', '☁️'],
        45: ['Fog', '🌫️', '🌫️'],
        48: ['Rime fog', '🌫️', '🌫️'],
        51: ['Light drizzle', '🌦️', '🌧️'],
        53: ['Moderate drizzle', '🌦️', '🌧️'],
        55: ['Dense drizzle', '🌧️', '🌧️'],
        56: ['Freezing drizzle', '🌧️', '🌧️'],
        57: ['Heavy freezing drizzle', '🌧️', '🌧️'],
        61: ['Slight rain', '🌦️', '🌧️'],
        63: ['Moderate rain', '🌧️', '🌧️'],
        65: ['Heavy rain', '🌧️', '🌧️'],
        66: ['Freezing rain', '🌧️', '🌧️'],
        67: ['Heavy freezing rain', '🌧️', '🌧️'],
        71: ['Slight snow', '🌨️', '🌨️'],
        73: ['Moderate snow', '❄️', '❄️'],
        75: ['Heavy snow', '❄️', '❄️'],
        77: ['Snow grains', '❄️', '❄️'],
        80: ['Slight rain showers', '🌦️', '🌧️'],
        81: ['Moderate rain showers', '🌧️', '🌧️'],
        82: ['Violent rain showers', '⛈️', '⛈️'],
        85: ['Slight snow showers', '🌨️', '🌨️'],
        86: ['Heavy snow showers', '❄️', '❄️'],
        95: ['Thunderstorm', '⛈️', '⛈️'],
        96: ['Thunderstorm with hail', '⛈️', '⛈️'],
        99: ['Severe thunderstorm with hail', '⛈️', '⛈️'],
      };

      const $ = (id) => document.getElementById(id);
      const els = {
        form: $('search-form'), input: $('city-input'), btn: $('search-btn'),
        empty: $('empty'), loading: $('loading'), error: $('error'), result: $('result'),
        place: $('place'), subplace: $('subplace'), updated: $('updated'),
        icon: $('icon'), temp: $('temp'), unit: $('unit'), condition: $('condition'),
        humidity: $('humidity'), feels: $('feels'), feelsUnit: $('feels-unit'), wind: $('wind'),
        toggle: $('unit-toggle'),
      };

      const state = { celsius: true, tempC: null, feelsC: null };
      let controller = null; // lets a new search cancel a stale one

      const show = (name) => {
        els.empty.classList.toggle('hidden', name !== 'empty');
        els.loading.classList.toggle('hidden', name !== 'loading');
        els.error.classList.toggle('hidden', name !== 'error');
        els.result.classList.toggle('hidden', name !== 'result');
      };

      const showError = (msg) => {
        els.error.textContent = msg;
        show('error');
      };

      const toDisplay = (c) => Math.round(state.celsius ? c : (c * 9) / 5 + 32);

      const renderTemps = () => {
        const u = state.celsius ? '°C' : '°F';
        els.temp.textContent = toDisplay(state.tempC);
        els.feels.textContent = toDisplay(state.feelsC);
        els.unit.textContent = u;
        els.feelsUnit.textContent = u;
        els.toggle.textContent = u;
      };

      async function fetchJson(url, signal) {
        const res = await fetch(url, { signal });
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        return res.json();
      }

      async function getWeather(city) {
        if (controller) controller.abort();
        const current = new AbortController();
        controller = current;
        const { signal } = current;

        show('loading');
        els.btn.disabled = true;

        try {
          // 1) City name -> coordinates
          const geo = await fetchJson(
            `${GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`,
            signal
          );
          if (!geo.results || geo.results.length === 0) {
            showError(`No city found matching “${city}”. Check the spelling and try again.`);
            return;
          }
          const { name, admin1, country, latitude, longitude } = geo.results[0];

          // 2) Coordinates -> current conditions
          const params = new URLSearchParams({
            latitude,
            longitude,
            current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day',
            timezone: 'auto',
          });
          const data = await fetchJson(`${FORECAST_URL}?${params}`, signal);
          const c = data.current;
          if (!c) throw new Error('Malformed weather response');

          const [label, dayIcon, nightIcon] = WMO[c.weather_code] || ['Unknown', '🌡️', '🌡️'];

          state.tempC = c.temperature_2m;
          state.feelsC = c.apparent_temperature;

          els.place.textContent = name;
          els.subplace.textContent = [admin1, country].filter(Boolean).join(', ');
          els.updated.textContent = `Updated ${c.time.replace('T', ' ')} (local time)`;
          els.icon.textContent = c.is_day ? dayIcon : nightIcon;
          els.condition.textContent = label;
          els.humidity.textContent = Math.round(c.relative_humidity_2m);
          els.wind.textContent = Math.round(c.wind_speed_10m);
          renderTemps();

          show('result');
          els.result.classList.remove('fade-up');
          void els.result.offsetWidth; // restart the animation
          els.result.classList.add('fade-up');
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.error(err);
          showError(
            navigator.onLine
              ? 'Something went wrong while fetching the weather. Please try again.'
              : 'You appear to be offline. Check your connection and try again.'
          );
        } finally {
          // Only the latest request re-enables the button
          if (controller === current) els.btn.disabled = false;
        }
      }

      els.form.addEventListener('submit', (e) => {
        e.preventDefault();
        const city = els.input.value.trim();
        if (city) getWeather(city);
      });

      els.toggle.addEventListener('click', () => {
        state.celsius = !state.celsius;
        if (state.tempC !== null) renderTemps();
      });
    })();
  </script>
</body>
</html>
